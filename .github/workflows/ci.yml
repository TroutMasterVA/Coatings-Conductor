name: CI

on:
  pull_request:
  push:
    branches: [main, release/beta-azure]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Each check runs even if an earlier one fails, so one red run shows
      # every problem at once.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

  build:
    name: build (vercel preset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Build uses scripts/with-app-env.mjs. migrate.mjs no-ops without
      # DATABASE_URL so CI stays on the PGLite preview path, never a prod DB.
      - name: Build
        run: npm run build
        env:
          VITE_AUTH_ENABLED: "true"

